/* TeamGuard refreshed visual theme — presentation only */
:root{
 --bg:#f3f6fc;--panel:#ffffff;--text:#17233b;--muted:#71809a;--line:#e4eaf4;
 --primary:#4f46e5;--soft:#eef0ff;--green:#0f9b72;--red:#dc4658;--amber:#b7791f;
 --shadow:0 14px 38px rgba(31,48,86,.08);
}
[data-theme="dark"]{
 --bg:#0b1220;--panel:#141f32;--text:#edf3ff;--muted:#9baac2;--line:#293851;
 --primary:#9295ff;--soft:#252c4d;--green:#52d6aa;--red:#ff8190;--amber:#f4c36d;
 --shadow:0 16px 40px rgba(0,0,0,.24);
}
body{
 background:
  radial-gradient(ellipse at 8% 0%,rgba(99,102,241,.10),transparent 34%),
  radial-gradient(ellipse at 96% 18%,rgba(14,165,233,.08),transparent 30%),
  var(--bg);
 font-family:Inter,"Segoe UI",system-ui,"Noto Sans Bengali",sans-serif;
 letter-spacing:.05px;
}
header{
 height:74px;background:color-mix(in srgb,var(--panel) 88%,transparent);
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 border-bottom:1px solid var(--line);box-shadow:0 4px 22px rgba(24,39,75,.035);
}
.brand{font-size:21px;letter-spacing:-.7px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#4f46e5,#06b6d4);box-shadow:0 7px 18px rgba(79,70,229,.25)}
main{margin:32px auto}
.card,.stat{
 border:1px solid color-mix(in srgb,var(--line) 82%,transparent);
 border-radius:20px;box-shadow:var(--shadow);
}
.card{padding:23px}
.login-wrap{
 position:relative;overflow:hidden;margin:9vh auto;padding:32px;
 background:linear-gradient(155deg,var(--panel),color-mix(in srgb,var(--panel) 90%,var(--soft)));
}
.login-wrap:before{
 content:"";position:absolute;width:190px;height:190px;border-radius:50%;
 background:linear-gradient(135deg,rgba(79,70,229,.14),rgba(6,182,212,.08));
 right:-75px;top:-90px;pointer-events:none;
}
.login-wrap>*{position:relative}
.login-wrap h1{font-size:27px;letter-spacing:-.8px;margin-top:18px}
.field{gap:8px;margin:15px 0}
.field label{font-size:12px;letter-spacing:.2px;text-transform:uppercase}
.field input,.field select,.field textarea{
 padding:12px 14px;border-radius:12px;border:1px solid var(--line);
 transition:border-color .18s,box-shadow .18s,background .18s;
}
.field input:focus,.field select:focus,.field textarea:focus{
 border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent);outline:none;
}
button{
 border-radius:12px;padding:10px 15px;font-weight:700;
 background:linear-gradient(135deg,var(--primary),#6366f1);
 box-shadow:0 5px 13px color-mix(in srgb,var(--primary) 19%,transparent);
 transition:transform .16s,filter .16s,box-shadow .16s;
}
button:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 22%,transparent)}
button:active{transform:translateY(0)}
button.secondary{background:var(--soft);color:var(--primary);box-shadow:none}
button.danger{background:#fff0f2;color:#c42e43;box-shadow:none}
[data-theme="dark"] button.danger{background:#422432;color:#ff9aa5}
.nav{
 border-radius:12px;padding:12px 13px;font-weight:650;box-shadow:none;
}
.nav:hover{background:var(--soft);color:var(--primary);transform:translateX(2px);box-shadow:none}
.nav.active{background:linear-gradient(100deg,var(--soft),color-mix(in srgb,var(--soft) 65%,var(--panel)));color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.sidebar{padding:13px}
.page-title{font-size:28px;letter-spacing:-.8px}
.stats{gap:14px}
.stat{padding:19px;background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 94%,var(--soft)));transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(31,48,86,.11)}
.stat strong{font-size:30px;letter-spacing:-1px}
.stat small{font-size:12px;font-weight:650;letter-spacing:.15px}
.section{margin-top:22px}
.section h3{letter-spacing:-.3px}
.table-wrap{border-radius:15px;box-shadow:0 5px 18px rgba(31,48,86,.035)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.55px}
td{font-size:13px}
tbody tr{transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 42%,var(--panel))}
.pill{padding:5px 10px;letter-spacing:.15px}
.notice{border:1px solid color-mix(in srgb,var(--primary) 13%,transparent);border-radius:13px}
.tabs button{box-shadow:none}
.empty{padding:34px 18px}
.footer-note{line-height:1.7}
@media(max-width:800px){
 main{margin:20px auto}
 .sidebar{padding:9px}
 .navs{gap:5px}
 .nav{padding:10px 12px}
 .page-title{font-size:24px}
}
@media(max-width:430px){
 .login-wrap{padding:24px 19px;margin:6vh auto}
 .login-wrap h1{font-size:24px}
 header{height:66px}
 .brand{font-size:18px}
 .card{padding:17px}
 .stats{gap:9px}
 .stat{border-radius:15px;padding:13px}
 .stat strong{font-size:24px}
}

<body>
<header><div class="brand"><div class="logo">TG</div>TeamGuard</div><div class="header-actions"><button class="secondary" id="themeBtn">☾ Theme</button><button class="secondary hidden" id="logoutBtn">Logout</button></div></header>
<main>
<section id="login" class="login-wrap card">
 <div class="logo" style="width:52px;height:52px;font-size:21px">TG</div>
 <div style="margin-top:18px"><span class="pill">SECURE WORKSPACE</span></div>
 <h1>Welcome to TeamGuard</h1><p class="muted">Sign in to continue to your inspection workspace.</p>
 <form id="loginForm" onsubmit="event.preventDefault();login()">
  <div class="field"><label>Email Address</label><input id="email" type="email" autocomplete="username" placeholder="Enter your email" required></div>
  <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>

</section>
<section id="app" class="hidden">
 <div class="between"><div><h1 class="page-title" id="welcome">Dashboard</h1><div class="muted" id="roleInfo"></div></div><span class="pill" id="today"></span></div>
 <div class="layout" style="margin-top:18px">
  <aside class="sidebar card"><div class="navs" id="navs"></div></aside>
  <div class="content" id="view"></div>
 </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://rnzkamwisslzcbweptbd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_LHxRrBGwJtkiGruccwjudQ_Gqcq86RQ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const KEY='teamguard_demo_v1';
const initial={users:[],pickers:[],schedule:[],reports:[],activity:[],notifications:[]};
let db=load(),current=null,page='dashboard',scheduleShift='Day',selectedLeaderId=null;
db.activity=db.activity||[];db.notifications=db.notifications||[];
function load(){let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){data=null}if(!data||typeof data!=='object'||Array.isArray(data))data=structuredClone(initial);if(!Array.isArray(data.users))data.users=[];if(!Array.isArray(data.pickers))data.pickers=[];if(!Array.isArray(data.schedule))data.schedule=[];if(!Array.isArray(data.reports))data.reports=[];if(!Array.isArray(data.activity))data.activity=[];if(!Array.isArray(data.notifications))data.notifications=[];return data}
let cloudSaveChain=Promise.resolve();
let cloudSyncState='offline';
function cloudSharedPayload(){return {pickers:db.pickers||[],schedule:db.schedule||[],activity:(db.activity||[]).slice(0,500),notifications:(db.notifications||[]).slice(0,200)}}
function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
 if(current?.role==='manager'&&current.workspaceId){
  const workspaceId=current.workspaceId,payload=cloudSharedPayload();
  cloudSaveChain=cloudSaveChain.then(async()=>{
   let result=await sb.from('teamguard_app_data').update({data:payload,updated_at:new Date().toISOString()}).eq('workspace_id',workspaceId).select('workspace_id').maybeSingle();
   if(result.error)throw result.error;
   if(!result.data){const ins=await sb.from('teamguard_app_data').insert({workspace_id:workspaceId,data:payload,updated_at:new Date().toISOString()});if(ins.error)throw ins.error}
   cloudSyncState='synced';
  }).catch(e=>{cloudSyncState='error';console.error('Cloud save failed:',e);});
 }
}
function logActivity(action,details){db.activity=db.activity||[];db.activity.unshift({id:uid(),action,details,by:current?.name||'System',userId:current?.id||'',at:new Date().toISOString()});db.activity=db.activity.slice(0,500)}
function notifyManager(title,message,reportId){db.notifications=db.notifications||[];db.notifications.unshift({id:uid(),title,message,reportId:reportId||'',at:new Date().toISOString(),read:false});db.notifications=db.notifications.slice(0,200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateISO(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function niceDate(s){if(!s)return '—';return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function shiftUsers(){return db.users.filter(u=>u.role==='leader'&&(current.role==='manager'||u.shift===current.shift))}
window.openApp=function(u){
 current=u;
 document.getElementById('login').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');
 document.getElementById('logoutBtn').classList.remove('hidden');
 document.getElementById('welcome').textContent='Welcome, '+u.name;
 document.getElementById('roleInfo').textContent=u.role==='manager'?'Manager • Day & Night Shift':'Shift Leader • '+u.shift+' Shift';
 document.getElementById('today').textContent=niceDate(dateISO());
 render();
}
async function loadTeamGuardProfile(authUser){
 const error=document.getElementById('loginError');
 try{
  const {data:member,error:memberError}=await sb.from('teamguard_members').select('workspace_id,user_id,username,role,full_name,shift').eq('user_id',authUser.id).maybeSingle();
  if(memberError)throw memberError;
  if(!member)throw new Error('This account is not assigned to a TeamGuard workspace. Ask the manager to add your account.');
  const role=String(member.role||'').toLowerCase();
  if(role!=='manager'&&role!=='leader')throw new Error('Your account role is not configured. Please contact the manager.');
  const u={id:authUser.id,authId:authUser.id,workspaceId:member.workspace_id,username:member.username||authUser.email,name:member.full_name||member.username||authUser.email,role,shift:member.shift||'Both',email:authUser.email};
  const {data:shared,error:sharedError}=await sb.from('teamguard_app_data').select('data').eq('workspace_id',u.workspaceId).maybeSingle();
  if(sharedError)throw sharedError;
  const cloud=shared?.data||{};
  db.pickers=Array.isArray(cloud.pickers)?cloud.pickers:[];
  db.schedule=Array.isArray(cloud.schedule)?cloud.schedule:[];
  db.activity=Array.isArray(cloud.activity)?cloud.activity:[];
  db.notifications=Array.isArray(cloud.notifications)?cloud.notifications:[];
  const {data:reportRows,error:reportError}=await sb.from('teamguard_reports').select('id,report_data,submitted_by,created_at').eq('workspace_id',u.workspaceId).order('created_at',{ascending:false});
  if(reportError)throw reportError;
  db.reports=(reportRows||[]).map(row=>({...row.report_data,id:row.report_data?.id||row.id,cloudId:row.id,leaderId:row.report_data?.leaderId||row.submitted_by}));
  if(role==='manager'){
   const {data:members,error:membersError}=await sb.from('teamguard_members').select('workspace_id,user_id,username,role,full_name,shift').eq('workspace_id',u.workspaceId);
   if(membersError)throw membersError;
   db.users=(members||[]).map(m=>({id:m.user_id,authId:m.user_id,workspaceId:m.workspace_id,username:m.username,name:m.full_name||m.username,role:m.role,shift:m.shift||'Both'}));
  }else{
   const {data:members,error:membersError}=await sb.from('teamguard_members').select('workspace_id,user_id,username,role,full_name,shift').eq('workspace_id',u.workspaceId);
   if(membersError)throw membersError;
   db.users=(members||[]).map(m=>({id:m.user_id,authId:m.user_id,workspaceId:m.workspace_id,username:m.username,name:m.full_name||m.username,role:m.role,shift:m.shift||'Both'}));
  }
  if(!db.users.some(x=>x.id===u.id))db.users.push(u);
  localStorage.setItem(KEY,JSON.stringify(db));
  cloudSyncState='synced';
  error.textContent='';
  window.openApp(u);
 }catch(e){
  console.error('TeamGuard cloud load error:',e);
  error.textContent=e.message||'Could not load cloud workspace. Please try again.';
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
 }
}
async function login(){
 const error=document.getElementById('loginError'),btn=document.getElementById('loginBtn');
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password){error.textContent='Enter your email and password.';return}
 btn.disabled=true;btn.textContent='Signing in…';error.textContent='';
 try{
  const {data,error:authError}=await sb.auth.signInWithPassword({email,password});
  if(authError) throw authError;
  await loadTeamGuardProfile(data.user);
 }catch(e){
  console.error('TeamGuard login error:',e);
  error.textContent=e.message||'Login failed. Check your email and password.';
 }finally{btn.disabled=false;btn.textContent='Sign In →'}
}
async function logout(){
 try{await sb.auth.signOut()}catch(e){console.error('Sign out error:',e)}
 current=null;
 document.getElementById('app').classList.add('hidden');
 document.getElementById('login').classList.remove('hidden');
 document.getElementById('logoutBtn').classList.add('hidden');
 document.getElementById('password').value='';
 document.getElementById('loginError').textContent='';
}
document.getElementById('logoutBtn').onclick=logout;
async function restoreSavedSession(){
 const loginPanel=document.getElementById('login'),appPanel=document.getElementById('app'),error=document.getElementById('loginError');
 loginPanel.classList.add('hidden');
 appPanel.classList.add('hidden');
 error.textContent='';
 const status=document.createElement('div');
 status.id='sessionRestoreStatus';
 status.className='login-wrap card';
 status.textContent='Restoring your saved session…';
 loginPanel.insertAdjacentElement('beforebegin',status);
 try{
  const {data,error:sessionError}=await sb.auth.getSession();
  if(sessionError)throw sessionError;
  if(data?.session?.user){
   await loadTeamGuardProfile(data.session.user);
  }else{
   loginPanel.classList.remove('hidden');
  }
 }catch(e){
  console.error('Session restore failed:',e);
  loginPanel.classList.remove('hidden');
  error.textContent='Could not restore your saved session. Please sign in again. '+(e.message||'');
 }finally{
  status.remove();
 }
}
restoreSavedSession();
document.getElementById('themeBtn').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('tg_theme',t)};document.documentElement.dataset.theme=localStorage.getItem('tg_theme')||'light';
function navItems(){return current.role==='manager'?[['dashboard','▦','Overview'],['leaders','♙','Leaders'],['performance','▥','Employee Performance'],['activity','◷','Activity History'],['notifications','♢','Notifications'+((db.notifications||[]).filter(n=>!n.read).length?' ('+(db.notifications||[]).filter(n=>!n.read).length+')':'')],['pickers','☷','Pickers & Lines'],['schedule','▦','Weekly Schedule'],['reports','▤','All Reports'],['account','⚙','My Account'],['backup','⬇','Backup & Restore']]:[['dashboard','▦','My Dashboard'],['inspection','✓','Today Inspection'],['reports','▤','My Reports']]}
function render(){document.getElementById('navs').innerHTML=navItems().map(([id,ic,n])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')">${ic} ${n}</button>`).join('');let f={dashboard:current.role==='manager'?managerHome:leaderHome,leaders:leadersPage,pickers:pickersPage,schedule:schedulePage,reports:reportsPage,inspection:inspectionPage,account:accountPage,backup:backupPage,performance:performancePage,activity:activityPage,notifications:notificationsPage};(f[page]||f.dashboard)()}
function go(p){page=p;render()}
function backupPage(){if(current?.role!=='manager'){go('dashboard');return}let size=new Blob([JSON.stringify(db)]).size;document.getElementById('view').innerHTML=`<div class="card"><h3>Backup & Restore</h3><p class="muted">Save a complete copy of the data currently stored in this browser before connecting Supabase.</p><div class="notice"><b>Important:</b> This backup includes manager/leader account details and reports with photos. Keep the downloaded file private. Do not send it to anyone.</div><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><small>Current backup size</small><strong>${(size/1024).toFixed(1)} KB</strong></div><div class="stat"><small>Saved data</small><strong>${db.users.length+db.pickers.length+db.schedule.length+db.reports.length}</strong><small>Accounts, pickers, schedules & reports</small></div></div><div class="section"><button onclick="downloadBackup()">⬇ Download Full Backup</button></div><div class="section"><h3>Restore a Backup</h3><p class="muted">Choose a TeamGuard backup JSON file. Restoring replaces the data currently stored in this browser.</p><input id="backupFile" type="file" accept=".json,application/json" style="display:block;margin:12px 0"><button class="secondary" onclick="restoreBackup()">Restore Backup</button></div><p class="footer-note">Backup is downloaded to your device. It is not uploaded to Supabase automatically. Keep at least one safe copy before any migration.</p></div>`}
function downloadBackup(){if(current?.role!=='manager')return alert('Only the manager can create a full backup.');try{let payload={app:'TeamGuard',formatVersion:1,exportedAt:new Date().toISOString(),data:db};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TeamGuard-Backup-'+dateISO()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('Backup downloaded. Keep the JSON file private and safe.')}catch(e){console.error(e);alert('Could not create backup. Please check available device storage.')}}
function restoreBackup(){if(current?.role!=='manager')return alert('Only the manager can restore a backup.');let input=document.getElementById('backupFile'),file=input?.files?.[0];if(!file)return alert('Please choose a TeamGuard backup JSON file first.');if(!confirm('Restore this backup? All TeamGuard data currently saved in this browser will be replaced. Download a fresh backup first if needed.'))return;let reader=new FileReader();reader.onload=()=>{try{let payload=JSON.parse(reader.result),data=payload?.data;if(payload?.app!=='TeamGuard'||!data||!Array.isArray(data.users)||!Array.isArray(data.pickers)||!Array.isArray(data.schedule)||!Array.isArray(data.reports))throw new Error('Invalid backup format');data.activity=Array.isArray(data.activity)?data.activity:[];data.notifications=Array.isArray(data.notifications)?data.notifications:[];if(!data.users.some(u=>u&&u.role==='manager'))throw new Error('Manager account missing');localStorage.setItem(KEY,JSON.stringify(data));alert('Backup restored successfully. TeamGuard will reload now.');location.reload()}catch(e){console.error(e);alert('This file is not a valid TeamGuard backup. No data was changed.')}};reader.onerror=()=>alert('Could not read the selected backup file.');reader.readAsText(file)}
function accountPage(){if(current.role!=='manager'){go('dashboard');return}document.getElementById('view').innerHTML=`<div class="card"><h3>Manager Account Settings</h3><p class="muted">Change your manager username and password. Your login email will remain the same.</p><div class="field"><label>New Username</label><input id="newManagerUser" autocomplete="username" value="${esc(current.username)}"></div><div class="field"><label>New Password</label><input id="newManagerPass" type="password" autocomplete="new-password" placeholder="Leave blank to keep current password"></div><div class="field"><label>Confirm New Password</label><input id="confirmManagerPass" type="password" autocomplete="new-password" placeholder="Re-enter new password"></div><button id="saveManagerAccountBtn" onclick="updateManagerAccount()">Save Account Changes</button><div id="accountMessage" class="muted" style="margin-top:12px;font-size:13px"></div></div>`}
async function updateManagerAccount(){
if(!current||current.role!=='manager')return;
const username=val('newManagerUser'),pass=document.getElementById('newManagerPass').value,confirmPass=document.getElementById('confirmManagerPass').value,msg=document.getElementById('accountMessage'),btn=document.getElementById('saveManagerAccountBtn');
if(!username){msg.textContent='Username cannot be empty.';return}
if((pass||confirmPass)&&pass.length<6){msg.textContent='New password must be at least 6 characters.';return}
if(pass!==confirmPass){msg.textContent='New passwords do not match.';return}
if(username===current.username&&!pass){msg.textContent='No changes to save.';return}
btn.disabled=true;msg.textContent='Saving account changes...';
try{
const {data:members,error:membersError}=await sb.from('teamguard_members').select('user_id,username').eq('workspace_id',current.workspaceId);
if(membersError)throw membersError;
if((members||[]).some(u=>u.user_id!==current.id&&(u.username||'').toLowerCase()===username.toLowerCase()))throw new Error('This username is already in use.');
if(pass){
const {error:passwordError}=await sb.auth.updateUser({password:pass});
if(passwordError)throw passwordError;
}
if(username!==current.username){
const {error:usernameError}=await sb.from('teamguard_members').update({username}).eq('user_id',current.id).eq('workspace_id',current.workspaceId);
if(usernameError)throw new Error((pass?'Password changed, but username could not be saved: ':'Username could not be saved: ')+usernameError.message);
current.username=username;
}
const localUser=(db.users||[]).find(u=>u.id===current.id||u.authId===current.id);
if(localUser)localUser.username=current.username;
save();
msg.textContent=(pass?'Password changed successfully. ':'')+(username!==''?'Account settings saved. ':'')+'Use your new password next time you sign in. Login email unchanged.';
document.getElementById('newManagerPass').value='';
document.getElementById('confirmManagerPass').value='';
document.getElementById('newManagerUser').value=current.username;
}catch(e){msg.textContent=e.message||'Could not update account settings.';}
finally{btn.disabled=false}
}
function stat(label,val){return `<div class="stat"><small>${label}</small><strong>${val}</strong></div>`}
function managerHome(){
let validLeaderIds=new Set(db.users.filter(x=>x.role==='leader').map(x=>x.id)),validPickerIds=new Set(db.pickers.map(x=>x.id)),before=db.schedule.length;
db.schedule=db.schedule.filter(x=>validLeaderIds.has(x.leaderId)&&validPickerIds.has(x.pickerId));if(db.schedule.length!==before)save();
let pickerCount=db.pickers.length,leaderCount=db.users.filter(x=>x.role==='leader').length,today=dateISO();
let scheduled=db.schedule.filter(x=>x.date===today).length,done=db.reports.filter(r=>{if(r.created){let d=new Date(r.created);return !isNaN(d.getTime())&&dateISO(d)===today}return r.date===today}).length;
let clickable=(label,value,target)=>`<div class="stat" role="button" tabindex="0" onclick="go('${target}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('${target}') }" style="cursor:pointer"><small>${label} · View</small><strong>${value}</strong></div>`;
let shiftRows=['Day','Night'].map(sh=>{let list=db.schedule.filter(x=>x.date===today&&x.shift===sh),completed=list.filter(x=>db.reports.some(r=>r.scheduleId===x.id)).length,pending=list.length-completed;return '<tr><td><b>'+sh+' Shift</b></td><td>'+list.length+'</td><td><span class="pill green">'+completed+'</span></td><td><span class="pill amber">'+pending+'</span></td></tr>'}).join('');
document.getElementById('view').innerHTML=`<div class="stats">${clickable('Total Pickers',pickerCount,'pickers')}${clickable('Shift Leader',leaderCount,'leaders')}${clickable("Today's Schedule",scheduled,'schedule')}${clickable('Reports Submitted Today',done,'reports')}</div>
<div class="card section"><div class="between"><h3>Day & Night Shift Summary</h3><span class="pill">${today}</span></div><div class="table-wrap"><table style="min-width:0"><thead><tr><th>Shift</th><th>Assigned</th><th>Completed</th><th>Pending</th></tr></thead><tbody>${shiftRows}</tbody></table></div></div>
<div class="card section"><h3>Weekly & Monthly Report Chart</h3><div class="grid2">${reportBars('This Week',weeklyReportStats())}${reportBars('This Month',monthlyReportStats())}</div></div>
<div class="card section"><div class="between"><h3>Today's Inspections</h3><button class="small" onclick="go('schedule')">View Schedule</button></div>${todayAssignments()}</div>
<div class="card section"><h3>Recent Reports</h3>${reportTable(db.reports.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,5))}</div>`;
}

function reportDate(r){if(r.created){let d=new Date(r.created);if(!isNaN(d.getTime()))return dateISO(d)}return r.date||''}
function weeklyReportStats(){let now=new Date(),monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));return Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);let key=dateISO(d);return {label:d.toLocaleDateString('en',{weekday:'short'}),count:db.reports.filter(r=>reportDate(r)===key).length}})}
function monthlyReportStats(){let now=new Date(),year=now.getFullYear(),month=now.getMonth(),days=new Date(year,month+1,0).getDate(),weeks=[];for(let start=1,n=1;start<=days;start+=7,n++){let end=Math.min(start+6,days);weeks.push({label:'W'+n,count:db.reports.filter(r=>{let d=reportDate(r);if(!d)return false;let x=new Date(d+'T00:00:00');return x.getFullYear()===year&&x.getMonth()===month&&x.getDate()>=start&&x.getDate()<=end}).length})}return weeks}
function reportBars(title,stats){let max=Math.max(1,...stats.map(x=>x.count));return '<div style="padding:14px;border:1px solid var(--line);border-radius:13px"><b>'+title+'</b><div style="display:flex;align-items:end;gap:8px;height:145px;margin-top:14px">'+stats.map(x=>'<div title="'+x.label+': '+x.count+' reports" style="flex:1;min-width:0;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px"><small>'+x.count+'</small><div style="width:100%;max-width:34px;height:'+Math.max(4,x.count/max*100)+'%;background:linear-gradient(180deg,var(--primary),#06b6d4);border-radius:6px 6px 2px 2px"></div><small class="muted">'+x.label+'</small></div>').join('')+'</div></div>'}
function leaderHome(){let mine=db.schedule.filter(s=>s.date===dateISO()&&s.shift===current.shift),done=db.reports.filter(r=>r.leaderId===current.id&&r.date===dateISO());document.getElementById('view').innerHTML=`<div class="stats">${stat('Assigned Lines Today',mine.length)}${stat('Reports Today',done.length)}${stat("My Team's Pickers",db.pickers.filter(p=>p.shift===current.shift).length)}${stat('Total Submitted Reports',db.reports.filter(r=>r.leaderId===current.id).length)}</div><div class="card section"><h3>Today&#39;s Tasks</h3>${mine.length?mine.map(s=>assignmentCard(s)).join(''):'<div class="empty">No lines have been assigned for today.</div>'}</div>`}
function todayAssignments(){let a=db.schedule.filter(s=>s.date===dateISO());return a.length?a.map(s=>assignmentCard(s)).join(''):'<div class="empty">No schedule is available for today.</div>'}
function assignmentCard(s){let p=db.pickers.find(x=>x.id===s.pickerId),l=db.users.find(x=>x.id===s.leaderId),done=db.reports.some(r=>r.scheduleId===s.id);return `<div style="padding:13px 0;border-top:1px solid var(--line)"><div class="between"><div><b>${esc(p?.name||'Picker deleted')}</b> <span class="pill">${esc(s.shift)}</span><div class="muted" style="font-size:12px">Line: ${esc(p?.line||'—')} • Leader: ${esc(l?.name||'—')}</div></div><div class="actions">${done?'<span class="pill green">Completed</span>':current.role==='leader'&&s.shift===current.shift?`<button class="small" onclick="startInspection('${s.id}')">Inspection</button>`:'<span class="pill amber">Pending</span>'}</div></div></div>`}
function leadersPage(){document.getElementById('view').innerHTML=`<div class="card"><h3>Create New Shift Leader</h3><div class="grid2"><div class="field"><label>Leader Name</label><input id="ln" placeholder="Full name"></div><div class="field"><label>Leader Email</label><input id="le" type="email" placeholder="leader@example.com"></div><div class="field"><label>Username</label><input id="lu" placeholder="unique username"></div><div class="field"><label>Password</label><input id="lp" type="password" placeholder="At least 6 characters"></div><div class="field"><label>Shift</label><select id="ls"><option>Day</option><option>Night</option><option>Both</option></select></div></div><div class="notice">Leader account will be created in Supabase and linked to this Manager's workspace. Use a valid email address.</div><button id="createLeaderBtn" onclick="addLeader()">Create Leader</button></div><div class="card section"><h3>Leader Accounts</h3><div class="notice">Click a leader's name or View Schedule to see and edit all schedules assigned to that leader.</div>${leadersTable()}</div>`}
function leadersTable(){let a=db.users.filter(u=>u.role==='leader');return a.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Shift</th><th>Action</th></tr></thead><tbody>${a.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.shift)}</td><td><div class="actions"><button class="small" style="background:linear-gradient(135deg,#0f9b72,#10b981)" onclick="viewLeaderSchedules('${u.id}')">📅 View Schedule</button><button class="secondary small" onclick="resetLeaderPassword('${u.id}')">Reset Password</button><button class="danger small" onclick="delUser('${u.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No leaders have been created yet.</div>'}
async function addLeader(){if(current?.role!=='manager')return alert('Only the Manager can create Leaders.');const name=val('ln').trim(),email=val('le').trim().toLowerCase(),username=val('lu').trim().toLowerCase(),password=val('lp'),shift=val('ls');if(!name||!email||!username||!password)return alert('Please complete all fields.');if(password.length<6)return alert('Password must be at least 6 characters.');if(db.users.some(u=>u.username===username))return alert('This username is already in use on this device.');const btn=document.getElementById('createLeaderBtn');btn.disabled=true;btn.textContent='Creating…';try{const {data,error}=await sb.functions.invoke('manage-leader',{body:{action:'create',name,email,username,password,shift}});if(error)throw error; if(!data?.success)throw new Error(data?.error||'Could not create Leader account.');db.users.push({id:data.leader.id,authId:data.leader.id,workspaceId:current.workspaceId,name:data.leader.name,username:data.leader.username,email:data.leader.email,shift:data.leader.shift,role:'leader'});save();alert('Leader account created successfully. The Leader can sign in using the email and password you set.');render();}catch(e){console.error('Create Leader failed:',e);alert(e.message||'Could not create Leader. Please try again.');}finally{const b=document.getElementById('createLeaderBtn');if(b){b.disabled=false;b.textContent='Create Leader';}}}
async function resetLeaderPassword(id){if(current?.role!=='manager')return alert('Only the Manager can reset Leader passwords.');const u=db.users.find(x=>x.id===id&&x.role==='leader');if(!u)return alert('Leader not found.');const next=prompt('Enter a new password for '+u.name+' (minimum 6 characters):');if(next===null)return;if(next.length<6)return alert('Password must be at least 6 characters long.');if(!confirm('Reset the Supabase login password for '+u.name+'?'))return;try{const {data,error}=await sb.functions.invoke('manage-leader',{body:{action:'reset_password',leaderUserId:u.authId||u.id,newPassword:next}});if(error){let detail=error.message||'Request failed';try{const ctx=error.context;if(ctx?.json){const body=await ctx.json();detail=body.details||body.error||detail}}catch(_){}throw new Error(detail)}if(!data?.success)throw new Error(data?.details||data?.error||'Password reset failed.');alert('Leader password updated successfully in Supabase. Share the new password securely.');}catch(e){console.error('Reset Leader password failed:',e);alert('Could not reset Leader password: '+(e.message||'Unknown error'));}}
function delUser(id){if(current?.role!=='manager')return alert('Only the manager can delete leaders.');let u=db.users.find(x=>x.id===id);if(!u)return;let schedules=db.schedule.filter(x=>x.leaderId===id).length,reports=db.reports.filter(x=>x.leaderId===id).length;if(!confirm('Delete '+u.name+' and also permanently delete '+schedules+' assigned schedule(s) and '+reports+' inspection report(s) linked to this leader?'))return;db.schedule=db.schedule.filter(x=>x.leaderId!==id);db.reports=db.reports.filter(x=>x.leaderId!==id);db.users=db.users.filter(x=>x.id!==id);save();render();alert('Leader and linked inspections/schedules deleted.')}
function viewLeaderSchedules(id){if(current?.role!=='manager')return alert('Only the manager can view leader schedules.');let u=db.users.find(x=>x.id===id&&x.role==='leader');if(!u)return alert('Leader not found.');selectedLeaderId=id;let a=db.schedule.filter(x=>x.leaderId===id).sort((x,y)=>x.date.localeCompare(y.date));document.getElementById('view').innerHTML=`<div class="card"><div class="between"><div><h3>${esc(u.name)} — All Schedules</h3><div class="muted">${esc(u.shift)} Shift • ${a.length} assigned schedule(s)</div></div><button class="secondary small" onclick="go('leaders')">← Back to Leaders</button></div><div class="notice">Here you can view every schedule assigned to this leader and edit its date, picker, shift or assigned leader.</div>${a.length?`<div class="table-wrap section"><table><thead><tr><th>Date</th><th>Picker</th><th>Line</th><th>Shift</th><th>Action</th></tr></thead><tbody>${a.map(x=>{let p=db.pickers.find(q=>q.id===x.pickerId);return `<tr><td>${niceDate(x.date)}</td><td>${esc(p?.name||'Deleted picker')}</td><td>${esc(p?.line||'—')}</td><td>${esc(x.shift)}</td><td><button class="small" onclick="editLeaderSchedule('${x.id}')">Edit</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No schedules are assigned to this leader yet.</div>'}</div>`}
function editLeaderSchedule(id){if(current?.role!=='manager')return alert('Only the manager can edit schedules.');let s=db.schedule.find(x=>String(x.id)===String(id));if(!s)return alert('Schedule not found.');let u=db.users.find(x=>x.id===s.leaderId),p=db.pickers.find(x=>x.id===s.pickerId);document.getElementById('view').innerHTML=`<div class="card"><div class="between"><h3>Edit Schedule</h3><button class="secondary small" onclick="viewLeaderSchedules('${s.leaderId}')">← Back</button></div><div class="notice">Assigned leader: <b>${esc(u?.name||'Unknown')}</b></div><div class="field"><label>Date</label><input id="editScheduleDate" type="date" value="${esc(s.date)}"></div><div class="field"><label>Shift</label><select id="editScheduleShift"><option ${s.shift==='Day'?'selected':''}>Day</option><option ${s.shift==='Night'?'selected':''}>Night</option></select></div><div class="field"><label>Picker</label><select id="editSchedulePicker">${db.pickers.map(q=>`<option value="${q.id}" ${q.id===s.pickerId?'selected':''}>${esc(q.name)} — ${esc(q.line)} (${esc(q.shift)})</option>`).join('')}</select></div><div class="field"><label>Assigned Shift Leader</label><select id="editScheduleLeader">${db.users.filter(q=>q.role==='leader').map(q=>`<option value="${q.id}" ${q.id===s.leaderId?'selected':''}>${esc(q.name)} — ${esc(q.shift)}</option>`).join('')}</select></div><div class="row"><button onclick="saveLeaderSchedule('${s.id}')">Save Changes</button><button class="secondary" onclick="viewLeaderSchedules('${s.leaderId}')">Cancel</button></div></div>`}
function saveLeaderSchedule(id){if(current?.role!=='manager')return alert('Only the manager can edit schedules.');let s=db.schedule.find(x=>String(x.id)===String(id));if(!s)return alert('Schedule not found.');let date=val('editScheduleDate'),shift=val('editScheduleShift'),pickerId=val('editSchedulePicker'),leaderId=val('editScheduleLeader');if(!date||!shift||!pickerId||!leaderId)return alert('Please complete all schedule fields.');if(db.schedule.some(x=>x.id!==s.id&&x.date===date&&x.pickerId===pickerId))return alert('This picker already has a schedule on this date.');let before={...s};s.date=date;s.shift=shift;s.pickerId=pickerId;s.leaderId=leaderId;try{let p=db.pickers.find(x=>x.id===pickerId),l=db.users.find(x=>x.id===leaderId);logActivity('Schedule Edited',(p?.name||'Picker')+' • '+date+' • '+shift+' Shift • Leader: '+(l?.name||'—'));save();let saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(!saved.schedule?.some(x=>x.id===s.id&&x.date===date&&x.pickerId===pickerId&&x.leaderId===leaderId))throw new Error('Save verification failed');selectedLeaderId=leaderId;viewLeaderSchedules(leaderId);alert('Schedule updated successfully.')}catch(e){Object.assign(s,before);alert('Could not save schedule changes in this browser. Please check browser storage.');console.error(e)}}
function pickersPage(){document.getElementById('view').innerHTML=`<div class="card"><h3>Add New Picker</h3><div class="grid2"><div class="field"><label>Picker Name</label><input id="pn" placeholder="Picker Name"></div><div class="field"><label>Line Number</label><input id="pl" placeholder="Example: A-01"></div><div class="field"><label>Shift</label><select id="ps"><option>Day</option><option>Night</option></select></div></div><button onclick="addPicker()">Add Picker</button></div><div class="card section"><div class="between"><h3>Picker List</h3><span class="pill">${db.pickers.length} pickers</span></div>${pickerTable()}</div>`}
function addPicker(){let name=val('pn'),line=val('pl'),shift=val('ps');if(!name||!line)return alert('Enter the name and line number.');db.pickers.push({id:uid(),name,line,shift});save();render()}
function pickerTable(){return db.pickers.length?`<div class="table-wrap"><table><thead><tr><th>Picker</th><th>Line</th><th>Shift</th><th>Action</th></tr></thead><tbody>${db.pickers.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.line)}</td><td>${esc(p.shift)}</td><td><button class="danger small" onclick="delPicker('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No pickers have been added.</div>'}
function delPicker(id){if(!confirm('Delete this picker?'))return;db.pickers=db.pickers.filter(p=>p.id!==id);save();render()}

function addSchedule(){let date=val('sd'),pickerId=val('sp'),leaderId=val('sl');if(!date||!pickerId||!leaderId)return alert('Create a picker and a leader first, then complete all selections.');let shift=scheduleShift;if(db.schedule.some(s=>s.date===date&&s.pickerId===pickerId))return alert('A schedule already exists for this picker on this date.');let id=uid();db.schedule.push({id,date,shift,pickerId,leaderId});let p=db.pickers.find(x=>x.id===pickerId),l=db.users.find(x=>x.id===leaderId);logActivity('Schedule Created',(p?.name||'Picker')+' • '+date+' • '+shift+' Shift • Leader: '+(l?.name||'—'));save();render()}

function preparePhoto(input){let file=input.files?.[0];if(!file){return}if(!file.type.startsWith('image/'))return alert('Please select an image file only.');if(file.size>8*1024*1024)return alert('Image size must be less than 8 MB.');let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{cropImage=img;cropZoom=1;cropX=50;cropY=50;showCropEditor()};img.src=reader.result};reader.readAsDataURL(file)}

function drawCrop(){let c=document.getElementById('cropCanvas');if(!c||!cropImage)return;let ctx=c.getContext('2d'),w=c.width,h=c.height,base=Math.max(w/cropImage.width,h/cropImage.height),scale=base*cropZoom,dw=cropImage.width*scale,dh=cropImage.height*scale,left=(w-dw)*cropX/100,top=(h-dh)*cropY/100;ctx.clearRect(0,0,w,h);ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);ctx.drawImage(cropImage,left,top,dw,dh)}

function performancePage(){if(current.role!=='manager'){go('dashboard');return}let leaders=db.users.filter(u=>u.role==='leader');let rows=leaders.map(u=>{let assigned=db.schedule.filter(s=>s.leaderId===u.id),submitted=db.reports.filter(r=>r.leaderId===u.id),today=assigned.filter(s=>s.date===dateISO()).length;return '<tr><td><b>'+esc(u.name)+'</b><div class="muted">'+esc(u.shift)+' Shift</div></td><td>'+assigned.length+'</td><td>'+submitted.length+'</td><td>'+today+'</td><td><span class="pill '+(assigned.length&&submitted.length>=assigned.length?'green':'amber')+'">'+(assigned.length?Math.round(submitted.length/assigned.length*100)+'%':'—')+'</span></td><td><button class="secondary small" onclick="viewLeaderSchedules(\''+u.id+'\')">Schedules</button></td></tr>'}).join('');document.getElementById('view').innerHTML='<div class="card"><div class="between"><div><h3>Employee Performance</h3><p class="muted">Leader-wise assigned inspections and submitted reports.</p></div><span class="pill">'+leaders.length+' Leaders</span></div><div class="table-wrap section"><table><thead><tr><th>Shift Leader</th><th>Inspections Assigned</th><th>Reports Submitted</th><th>Today Assigned</th><th>Report / Assignment</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">No leaders found.</td></tr>')+'</tbody></table></div><p class="footer-note">Counts are based on schedules and reports currently saved in this browser.</p></div>'}
function activityPage(){if(current.role!=='manager'){go('dashboard');return}let a=db.activity||[];document.getElementById('view').innerHTML='<div class="card"><div class="between"><div><h3>Activity History</h3><p class="muted">Schedule create, edit, delete and report submission events.</p></div><span class="pill">'+a.length+' Events</span></div>'+(a.length?'<div class="table-wrap section"><table><thead><tr><th>Time</th><th>Person</th><th>Activity</th><th>Details</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+new Date(x.at).toLocaleString()+'</td><td>'+esc(x.by)+'</td><td><span class="pill">'+esc(x.action)+'</span></td><td>'+esc(x.details)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No activity recorded yet. New actions will appear here.</div>')+'</div>'}
function notificationsPage(){if(current.role!=='manager'){go('dashboard');return}let a=db.notifications||[];document.getElementById('view').innerHTML='<div class="card"><div class="between"><div><h3>Notifications</h3><p class="muted">New report submission alerts.</p></div><button class="secondary small" onclick="markNotificationsRead()">Mark all as read</button></div>'+(a.length?a.map(n=>'<div class="between" style="padding:14px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.message)+'</div><small class="muted">'+new Date(n.at).toLocaleString()+'</small></div><div class="actions">'+(!n.read?'<span class="pill amber">New</span>':'<span class="pill">Read</span>')+(n.reportId?'<button class="small" onclick="openNotificationReport(\''+n.reportId+'\')">View Report</button>':'')+'</div></div>').join(''):'<div class="empty">No notifications yet. New submitted reports will appear here.</div>')+'</div>'}
function markNotificationsRead(){(db.notifications||[]).forEach(n=>n.read=true);save();render()}
function openNotificationReport(id){let n=(db.notifications||[]).find(x=>x.reportId===id);if(n)n.read=true;save();page='reports';reportDetails(id)}

function val(id){return document.getElementById(id)?.value?.trim()||''}
</script>
</body>
</html>
