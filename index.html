/* TeamGuard refreshed visual theme — presentation only */
:root{
 --bg:#f3f6fc;--panel:#ffffff;--text:#17233b;--muted:#71809a;--line:#e4eaf4;
 --primary:#4f46e5;--soft:#eef0ff;--green:#0f9b72;--red:#dc4658;--amber:#b7791f;
 --shadow:0 14px 38px rgba(31,48,86,.08);
}
[data-theme="dark"]{
 --bg:#0b1220;--panel:#141f32;--text:#edf3ff;--muted:#9baac2;--line:#293851;
 --primary:#9295ff;--soft:#252c4d;--green:#52d6aa;--red:#ff8190;--amber:#f4c36d;
 --shadow:0 16px 40px rgba(0,0,0,.24);
}
body{
 background:
  radial-gradient(ellipse at 8% 0%,rgba(99,102,241,.10),transparent 34%),
  radial-gradient(ellipse at 96% 18%,rgba(14,165,233,.08),transparent 30%),
  var(--bg);
 font-family:Inter,"Segoe UI",system-ui,"Noto Sans Bengali",sans-serif;
 letter-spacing:.05px;
}
header{
 height:74px;background:color-mix(in srgb,var(--panel) 88%,transparent);
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 border-bottom:1px solid var(--line);box-shadow:0 4px 22px rgba(24,39,75,.035);
}
.brand{font-size:21px;letter-spacing:-.7px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#4f46e5,#06b6d4);box-shadow:0 7px 18px rgba(79,70,229,.25)}
main{margin:32px auto}
.card,.stat{
 border:1px solid color-mix(in srgb,var(--line) 82%,transparent);
 border-radius:20px;box-shadow:var(--shadow);
}
.card{padding:23px}
.login-wrap{
 position:relative;overflow:hidden;margin:9vh auto;padding:32px;
 background:linear-gradient(155deg,var(--panel),color-mix(in srgb,var(--panel) 90%,var(--soft)));
}
.login-wrap:before{
 content:"";position:absolute;width:190px;height:190px;border-radius:50%;
 background:linear-gradient(135deg,rgba(79,70,229,.14),rgba(6,182,212,.08));
 right:-75px;top:-90px;pointer-events:none;
}
.login-wrap>*{position:relative}
.login-wrap h1{font-size:27px;letter-spacing:-.8px;margin-top:18px}
.field{gap:8px;margin:15px 0}
.field label{font-size:12px;letter-spacing:.2px;text-transform:uppercase}
.field input,.field select,.field textarea{
 padding:12px 14px;border-radius:12px;border:1px solid var(--line);
 transition:border-color .18s,box-shadow .18s,background .18s;
}
.field input:focus,.field select:focus,.field textarea:focus{
 border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 14%,transparent);outline:none;
}
button{

 background:linear-gradient(135deg,var(--primary),#6366f1);
 box-shadow:0 5px 13px color-mix(in srgb,var(--primary) 19%,transparent);
 transition:transform .16s,filter .16s,box-shadow .16s;
}
button:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 22%,transparent)}
button:active{transform:translateY(0)}
button.secondary{background:var(--soft);color:var(--primary);box-shadow:none}
button.danger{background:#fff0f2;color:#c42e43;box-shadow:none}

.nav{

}
.nav:hover{background:var(--soft);color:var(--primary);transform:translateX(2px);box-shadow:none}
.nav.active{background:linear-gradient(100deg,var(--soft),color-mix(in srgb,var(--soft) 65%,var(--panel)));color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.sidebar{padding:13px}
.page-title{font-size:28px;letter-spacing:-.8px}
.stats{gap:14px}

.stat:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(31,48,86,.11)}
.stat strong{font-size:30px;letter-spacing:-1px}
.stat small{font-size:12px;font-weight:650;letter-spacing:.15px}
.section{margin-top:22px}
.section h3{letter-spacing:-.3px}
.table-wrap{border-radius:15px;box-shadow:0 5px 18px rgba(31,48,86,.035)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.55px}
td{font-size:13px}
tbody tr{transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 42%,var(--panel))}
.pill{padding:5px 10px;letter-spacing:.15px}
.notice{border:1px solid color-mix(in srgb,var(--primary) 13%,transparent);border-radius:13px}
.tabs button{box-shadow:none}
.empty{padding:34px 18px}
.footer-note{line-height:1.7}
@media(max-width:800px){

 .sidebar{padding:9px}
 .navs{gap:5px}

@media(max-width:430px){

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL="https://rnzkamwisslzcbweptbd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_LHxRrBGwJtkiGruccwjudQ_Gqcq86RQ";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const KEY='teamguard_demo_v1';
const initial={users:[],pickers:[],schedule:[],reports:[],activity:[],notifications:[],products:[],inspectionStatuses:[]};
let db=load(),current=null,page='dashboard',scheduleShift='Day',selectedLeaderId=null,reportFilterDate='';
db.activity=db.activity||[];db.notifications=db.notifications||[];db.products=Array.isArray(db.products)?db.products:[];db.dismissedInspections=Array.isArray(db.dismissedInspections)?db.dismissedInspections:[];db.inspectionStatuses=Array.isArray(db.inspectionStatuses)?db.inspectionStatuses:[];
function load(){let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){data=null}if(!data||typeof data!=='object'||Array.isArray(data))data=structuredClone(initial);if(!Array.isArray(data.users))data.users=[];if(!Array.isArray(data.pickers))data.pickers=[];if(!Array.isArray(data.schedule))data.schedule=[];if(!Array.isArray(data.reports))data.reports=[];if(!Array.isArray(data.activity))data.activity=[];if(!Array.isArray(data.notifications))data.notifications=[];if(!Array.isArray(data.products))data.products=[];return data}
function pruneExpiredNotifications(){const before=(db.notifications||[]).length,now=Date.now();db.notifications=(db.notifications||[]).filter(n=>{const at=Date.parse(n.at||'');return !Number.isFinite(at)||now-at<86400000});return db.notifications.length!==before}
let cloudSaveChain=Promise.resolve();
let cloudSyncState='offline';
let cloudPollTimer=null,cloudPullBusy=false,lastCloudUpdatedAt=null,lastReportsSignature='',lastMembersSignature='',lastUiDate=dateISO();
function cloudSharedPayload(){return {pickers:db.pickers||[],schedule:db.schedule||[],dismissedInspections:db.dismissedInspections||[],activity:(db.activity||[]).slice(0,500),notifications:(db.notifications||[]).slice(0,200),products:db.products||[]}}
function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
 if(current?.role==='manager'&&current.workspaceId){
  const workspaceId=current.workspaceId,payload=cloudSharedPayload();
  cloudSyncState='saving';
  cloudSaveChain=cloudSaveChain.then(async()=>{
   const stamp=new Date().toISOString();
   const result=await sb.from('teamguard_app_data').upsert({workspace_id:workspaceId,data:payload,updated_at:stamp},{onConflict:'workspace_id'}).select('workspace_id').single();
   if(result.error)throw result.error;
   lastCloudUpdatedAt=stamp;
   cloudSyncState='synced';
  }).catch(e=>{cloudSyncState='error';console.error('Cloud save failed:',e);});
 }
}
async function saveCloudOrThrow(){
 if(current?.role!=='manager'||!current.workspaceId)throw new Error('Only the Manager can save shared workspace data.');
 await cloudSaveChain;
 cloudSyncState='saving';
 const stamp=new Date().toISOString();
 const {error}=await sb.from('teamguard_app_data').upsert({workspace_id:current.workspaceId,data:cloudSharedPayload(),updated_at:stamp},{onConflict:'workspace_id'});
 if(error){cloudSyncState='error';throw error;}
 lastCloudUpdatedAt=stamp;
 cloudSyncState='synced';
}
function logActivity(action,details){db.activity=db.activity||[];db.activity.unshift({id:uid(),action,details,by:current?.name||'System',userId:current?.id||'',at:new Date().toISOString()});db.activity=db.activity.slice(0,500)}
function notifyManager(title,message,reportId){db.notifications=db.notifications||[];db.notifications.unshift({id:uid(),title,message,reportId:reportId||'',at:new Date().toISOString(),read:false});db.notifications=db.notifications.slice(0,200)}
function notifyMissedLeaderTasks(){if(current?.role!=='manager')return false;const today=dateISO();let added=false;for(const task of (db.schedule||[])){if(!task.date||String(task.date)>=today||task.missedNotifiedAt||inspectionComplete(task.id))continue;const leader=db.users.find(x=>String(x.id)===String(task.leaderId)),picker=db.pickers.find(x=>String(x.id)===String(task.pickerId));notifyManager('Task Not Completed',(leader?.name||'Leader')+' did not complete the task on '+(picker?.line||picker?.name||'assigned')+' line for '+niceDate(task.date)+'.');task.missedNotifiedAt=new Date().toISOString();added=true;}if(added)save();return added}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateISO(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function niceDate(s){if(!s)return '—';return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function shiftUsers(){return db.users.filter(u=>u.role==='leader'&&(current.role==='manager'||u.shift===current.shift))}
window.openApp=function(u){
 current=u;
 document.getElementById('login').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');
 document.getElementById('logoutBtn').classList.remove('hidden');
 document.getElementById('welcome').textContent='Welcome, '+u.name;
 document.getElementById('roleInfo').textContent=u.role==='manager'?'Manager • Day & Night Shift':'Shift Leader • '+u.shift+' Shift';
 document.getElementById('today').textContent=niceDate(dateISO());
 render();
}

async function pullCloudUpdates(){
 if(!current||cloudPullBusy)return;
 const who=current,workspaceId=who.workspaceId;
 if(!workspaceId)return;
 cloudPullBusy=true;
 let changed=false;
 try{
  // Shared Pickers, Schedules, Activity and Notifications
  if(cloudSyncState==='synced'){
   const {data:shared,error}=await sb.from('teamguard_app_data')
    .select('data,updated_at').eq('workspace_id',workspaceId).maybeSingle();
   if(error)throw error;
   if(shared&&shared.updated_at&&shared.updated_at!==lastCloudUpdatedAt){
    const cloud=shared.data||{};
    db.pickers=Array.isArray(cloud.pickers)?cloud.pickers:[];
    db.schedule=Array.isArray(cloud.schedule)?cloud.schedule:[];
    db.dismissedInspections=Array.isArray(cloud.dismissedInspections)?cloud.dismissedInspections:[];
    db.activity=Array.isArray(cloud.activity)?cloud.activity:[];
    db.notifications=Array.isArray(cloud.notifications)?cloud.notifications:[];
    db.products=Array.isArray(cloud.products)?cloud.products:[];
    lastCloudUpdatedAt=shared.updated_at;
    changed=true;
   }
  }

  // Inspection progress is a small cloud status record, separate from private local drafts.
  const {data:statusRows,error:statusError}=await sb.from('teamguard_inspection_status').select('schedule_id,workspace_id,leader_id,status,updated_at').eq('workspace_id',workspaceId);
  if(statusError)throw statusError;
  const nextStatuses=(statusRows||[]).map(x=>({scheduleId:String(x.schedule_id),leaderId:x.leader_id,status:x.status,updatedAt:x.updated_at}));
  if(JSON.stringify(nextStatuses)!==JSON.stringify(db.inspectionStatuses||[])){db.inspectionStatuses=nextStatuses;changed=true;}
   if(notifyMissedLeaderTasks())changed=true;

  // Reports are stored separately, so refresh them for both Manager and Leader.
  const {data:reportRows,error:reportError}=await sb.from('teamguard_reports')
   .select('id,report_data,submitted_by,created_at')
   .eq('workspace_id',workspaceId).order('created_at',{ascending:false});
  if(reportError)throw reportError;
  let reports=(reportRows||[]).map(row=>({
   ...(row.report_data||{}),
   id:row.report_data?.id||row.id,
   cloudId:row.id,
   leaderId:row.report_data?.leaderId||row.submitted_by
  }));
  // Manager retention policy: permanently remove cloud reports once their report date is 20 days old.
  if(current===who&&who.role==='manager'){
   const cutoffDate=new Date();cutoffDate.setHours(0,0,0,0);cutoffDate.setDate(cutoffDate.getDate()-20);
   const cutoff=dateISO(cutoffDate);
   const expired=reports.filter(r=>{const d=String(r.date||reportDate(r)||'').slice(0,10);return d&&d<=cutoff;});
   if(expired.length){
    const cloudIds=expired.map(r=>r.cloudId).filter(Boolean);
    if(cloudIds.length){
     const {error:deleteError}=await sb.from('teamguard_reports').delete().eq('workspace_id',workspaceId).in('id',cloudIds);
     if(deleteError)throw deleteError;
    }
    db.dismissedInspections=db.dismissedInspections||[];
    expired.forEach(r=>{if(r.scheduleId&&!inspectionDismissed(r.scheduleId))db.dismissedInspections.push(r.scheduleId)});
    const expiredIds=new Set(expired.map(r=>String(r.id)));
    reports=reports.filter(r=>!expiredIds.has(String(r.id)));
    changed=true;
    console.info('TeamGuard retention: removed',expired.length,'reports dated on or before',cutoff);
   }
  }
  const reportSignature=JSON.stringify(reports);
  if(reportSignature!==lastReportsSignature){
   db.reports=reports;
   lastReportsSignature=reportSignature;
   changed=true;
  }

  // Remove completed schedules after their scheduled date; reports remain stored separately.
  if(current===who&&who.role==='manager'&&pruneExpiredCompletedSchedules()){
   localStorage.setItem(KEY,JSON.stringify(db));
   await saveCloudOrThrow();
   changed=true;
  }

  // Keep the workspace roster current for names and Leader changes.
  const {data:members,error:membersError}=await sb.from('teamguard_members')
   .select('workspace_id,user_id,username,role,full_name,shift')
   .eq('workspace_id',workspaceId);
  if(membersError)throw membersError;
  const users=(members||[]).map(m=>({

   role:m.role,shift:m.shift||'Both'
  }));
  if(!users.some(x=>x.id===who.id))users.push(who);
  const membersSignature=JSON.stringify(users);
  if(membersSignature!==lastMembersSignature){
   db.users=users;
   lastMembersSignature=membersSignature;
   changed=true;
  }

  if(changed){
   localStorage.setItem(KEY,JSON.stringify(db));
   const active=document.activeElement;
   const editing=active&&(['INPUT','TEXTAREA','SELECT'].includes(active.tagName));

  }

  console.error('TeamGuard auto-sync error:',e);

  cloudPullBusy=false;

function normalizeHeader(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
async function uploadProductFile(){
 const input=document.getElementById('productFile'),file=input?.files?.[0],status=document.getElementById('productUploadStatus'),btn=document.getElementById('uploadProductsBtn');
 if(!file)return alert('Please choose an Excel or CSV file.');
 if(!/\.(xlsx|csv)$/i.test(file.name))return alert('Only .xlsx and .csv files are supported.');
 try{
  btn.disabled=true;status.textContent='Reading file...';
  const data=await file.arrayBuffer();
  let workbook;
  if(file.name.toLowerCase().endsWith('.csv'))workbook=XLSX.read(new TextDecoder('utf-8').decode(data),{type:'string'});
  else workbook=XLSX.read(data,{type:'array'});
  const sheet=workbook.Sheets[workbook.SheetNames[0]];
  if(!sheet)throw new Error('The file does not contain a worksheet.');
  const rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});
  if(!rows.length)throw new Error('No product rows were found in the first sheet.');
  const first=rows[0],keys=Object.keys(first),mapped={};
  for(const key of keys){const h=normalizeHeader(key);if(['productname','product','name','itemname','description'].includes(h))mapped.name=key;else if(['barcode','bar code','ean','upc','gtin','itembarcode'].includes(h))mapped.barcode=key;else if(['sku','itemcode','productcode','stockkeepingunit'].includes(h))mapped.sku=key}
  if(!mapped.name||!mapped.barcode||!mapped.sku)throw new Error('Required columns not found. Please include Product Name, Barcode and SKU headers.');
  const imported=rows.map(row=>({name:String(row[mapped.name]??'').trim(),barcode:String(row[mapped.barcode]??'').trim(),sku:String(row[mapped.sku]??'').trim()})).filter(x=>x.name&&x.barcode);
  if(!imported.length)throw new Error('No valid rows found. Each product must have a Product Name and Barcode.');
  db.products=imported;
  localStorage.setItem(KEY,JSON.stringify(db));
  await saveCloudOrThrow();
  logActivity('Product File Uploaded',file.name+' • '+imported.length+' product rows');
  localStorage.setItem(KEY,JSON.stringify(db));
  status.textContent='Upload successful. '+imported.length+' product rows saved to Cloud. The previous product file was replaced.';
  alert('Product file uploaded successfully. '+imported.length+' rows saved to Cloud.');
 }catch(e){console.error('Product file upload failed:',e);status.textContent='Upload failed: '+(e.message||'Please try again.');alert('Product file upload failed: '+(e.message||'Please try again.'))}
 finally{if(btn)btn.disabled=false}
}

async function lookupInspectionProduct(auto=false){
 const raw=String(val('ipbarcode')||'').trim(),code=raw.replace(/\s+/g,''),status=document.getElementById('barcodeLookupStatus'),panel=document.getElementById('inspectionProductMatches');
 if(panel)panel.innerHTML='';
 window.inspectionSearchMatches=[];window.inspectionSelectedProduct=false;
 if(!code){if(status)status.textContent='Scan or enter the product barcode.';return}
 const products=db.products||[];
 const barcodeOf=p=>String(p.barcode??p.Barcode??p.ean??p.upc??'').trim().replace(/\s+/g,'');
 let matches=products.filter(p=>barcodeOf(p)===code);
 if(!matches.length&&code.length>=4)matches=products.filter(p=>barcodeOf(p).includes(code));
 if(!matches.length){if(status)status.textContent=auto?'No matching product found. Try the full barcode or at least 4 consecutive digits.':'Barcode not found in the uploaded product list.';return}
 window.inspectionSearchMatches=matches;
 if(status)status.textContent=matches.length===1?'Product found. Tap Select beside it.':matches.length+' matching products. Choose the correct one.';
 if(panel)panel.innerHTML=matches.map((p,i)=>'<div class="between" style="padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:7px"><div><b>'+esc(p.name||p.product_name||p.productName||'Unnamed product')+'</b><div class="muted" style="font-size:12px">Barcode: '+esc(barcodeOf(p)||'—')+' • SKU: '+esc(p.sku||p.SKU||'—')+'</div></div><button class="small" type="button" onclick="selectInspectionProduct('+i+')">Select</button></div>').join('');
}

async function preparePhotos(input){
 const files=Array.from(input.files||[]);if(!files.length)return;
 if(pendingPhotos.length+files.length>3){alert('You can add up to 3 clear photos per product.');input.value='';return}
 photoProcessingCount++;
 const preview=document.getElementById('photoPreview');if(preview)preview.textContent='Preparing photo(s)… please wait.';
 try{
  for(const file of files){
   if(!file.type.startsWith('image/'))throw new Error('Please select image files only.');
   if(file.size>8*1024*1024)throw new Error('Each image must be less than 8 MB.');
   const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read image.'));reader.readAsDataURL(file)});
   const compressed=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,480/img.width,360/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.42))};img.onerror=()=>reject(new Error('Could not process image.'));img.src=dataUrl});
   pendingPhotos.push(compressed);
  }
 }catch(e){alert(e.message||'Could not process photos.')}
 finally{input.value='';photoProcessingCount=Math.max(0,photoProcessingCount-1);if(photoProcessingCount===0){photoProcessingWaiters.splice(0).forEach(resolve=>resolve());renderPhotoPreview()}}
}

   const compressed=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,480/img.width,360/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.42))};img.onerror=()=>reject(new Error('Could not process image.'));img.src=dataUrl});

function showCropEditor(){let el=document.getElementById('photoPreview');if(!el||!cropImage)return;el.innerHTML=`<div style="margin-top:10px"><canvas id="cropCanvas" width="240" height="180" style="width:240px;max-width:100%;height:180px;object-fit:contain;background:#111;border-radius:8px"></canvas><div class="field"><label>Zoom</label><input type="range" min="1" max="3" step=".05" value="${cropZoom}" oninput="cropZoom=Number(this.value);drawCrop()"></div><div class="grid2"><div class="field"><label>Horizontal</label><input type="range" min="0" max="100" value="${cropX}" oninput="cropX=Number(this.value);drawCrop()"></div><div class="field"><label>Vertical</label><input type="range" min="0" max="100" value="${cropY}" oninput="cropY=Number(this.value);drawCrop()"></div></div><div class="row"><button class="small" onclick="applyCrop()">Crop & Use Photo</button><button class="secondary small" onclick="cancelCrop()">Cancel</button></div></div>`;drawCrop()}

}.photos{margin-top:12px}.photo-grid,.overall-photos{display:flex;flex-wrap:wrap;gap:9px;margin-top:7px}.photo-grid img,.overall-photos img{max-width:48%;max-height:190px;object-fit:contain;border:1px solid #e0e6ef;border-radius:8px;padding:4px;background:#fff}.note{background:#f5f8fd;border:1px solid #e4eaf3;border-radius:10px;padding:14px;white-space:pre-wrap;color:#43536d;min-height:48px}.empty{padding:18px;text-align:center;color:#77849a;background:#f7f9fc;border:1px dashed #d7dfeb;border-radius:10px}.foot{margin-top:28px;padding-top:12px;border-top:1px solid #e5eaf2;display:flex;justify-content:space-between;gap:12px;color:#8290a5;font-size:10px}.foot b{color:#536785}@page{size:A4;margin:13mm}@media print{body{background:#fff}.page{max-width:none;margin:0;padding:0;box-shadow:none}.hero,.stat,.qty{print-color-adjust:exact;-webkit-print-color-adjust:exact}.issue{break-inside:avoid;page-break-inside:avoid}.section-title{break-after:avoid}}'+
'</style></head><body><main class="page"><header class="hero"><div class="brand">TEAMGUARD • QUALITY & INSPECTION</div><h1>Inspection Report</h1><p>Detailed inspection record and findings</p><span class="date-tag">'+niceDate(r.date)+'</span></header><h2 class="section-title">Inspection Information</h2><div class="meta"><div class="cell"><span>Picker</span><b>'+esc(p?.name||'—')+'</b></div><div class="cell"><span>Line</span><b>'+esc(p?.line||'—')+'</b></div><div class="cell"><span>Shift</span><b>'+esc(r.shift||'—')+'</b></div><div class="cell"><span>Shift Leader</span><b>'+esc(l?.name||'—')+'</b></div><div class="cell"><span>Report Date</span><b>'+niceDate(r.date)+'</b></div><div class="cell"><span>Submitted</span><b>'+(r.created?new Date(r.created).toLocaleString():'—')+'</b></div></div><div class="stats"><div class="stat"><span>Items recorded</span><b>'+items.length+'</b></div><div class="stat"><span>Total quantity</span><b>'+total+' PCS</b></div></div><h2 class="section-title">Problems / Items Found</h2>'+(itemsHtml||'<div class="empty">No expiry products or issues were recorded in this inspection.</div>')+'<h2 class="section-title">Overall Comments / Additional Problems</h2><div class="note">'+esc(r.note||'No overall comment was recorded.')+'</div>'+(overallPhotos?'<div class="photos"><b>Overall problem photos</b><div class="overall-photos">'+overallPhotos+'</div></div>':'')+'<footer class="foot"><span><b>TEAMGUARD</b> • Inspection Management</span><span>Generated '+new Date().toLocaleString()+'</span></footer></main><script>window.addEventListener("load",()=>{const imgs=[...document.images];Promise.all(imgs.map(i=>i.complete?Promise.resolve():new Promise(res=>{i.onload=res;i.onerror=res}))).then(()=>setTimeout(()=>window.print(),500))});<\/script></body></html>';

async function deleteInspection(id){if(current?.role!=='manager')return alert('Only the manager can delete inspections.');let r=db.reports.find(x=>String(x.id)===String(id));if(!r)return alert('Inspection report not found.');if(!confirm('Permanently delete this entire inspection report, including all product details and photos?'))return;try{const {error}=await sb.from('teamguard_reports').delete().eq('workspace_id',current.workspaceId).eq('id',r.cloudId||r.id);if(error)throw error;db.reports=db.reports.filter(x=>String(x.id)!==String(id));db.dismissedInspections=db.dismissedInspections||[];if(r.scheduleId&&!inspectionDismissed(r.scheduleId))db.dismissedInspections.push(r.scheduleId);localStorage.setItem(KEY,JSON.stringify(db));await saveCloudOrThrow();render();alert('Inspection report deleted from Cloud. This inspection will remain Complete and will not return to Pending.')}catch(e){alert('Could not delete report from Cloud: '+(e.message||'Please try again.'));console.error(e)}}
async function clearReports(){if(current?.role!=='manager')return alert('Only the manager can delete reports.');if(!db.reports.length)return alert('There are no reports to clear.');if(!confirm('All reports from every shift will be permanently deleted from Cloud. Are you sure?'))return;try{const {error}=await sb.from('teamguard_reports').delete().eq('workspace_id',current.workspaceId);if(error)throw error;db.dismissedInspections=db.dismissedInspections||[];for(const r of db.reports){if(r.scheduleId&&!inspectionDismissed(r.scheduleId))db.dismissedInspections.push(r.scheduleId)}db.reports=[];localStorage.setItem(KEY,JSON.stringify(db));await saveCloudOrThrow();alert('All Cloud reports cleared successfully. Completed inspections will remain Complete.');render()}catch(e){alert('Could not clear Cloud reports: '+(e.message||'Please try again.'));console.error(e)}}
function reportTable(a){return a.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Shift</th><th>Picker</th><th>Line</th><th>Leader</th><th>Items</th><th>Qty</th><th>Action</th></tr></thead><tbody>${a.map(r=>{let p=db.pickers.find(x=>x.id===r.pickerId),l=db.users.find(x=>x.id===r.leaderId);return `<tr><td>${niceDate(r.date)}</td><td>${esc(r.shift)}</td><td>${esc(p?.name||'—')}</td><td>${esc(p?.line||'—')}</td><td>${esc(l?.name||'—')}</td><td>${(r.items||[]).length}</td><td>${(r.items||[]).reduce((n,i)=>n+(Number(i.qty)||0),0)} PCS</td><td><div class="actions"><button class="small" onclick="reportDetails('${esc(r.id)}')">View Details</button><button class="secondary small" onclick="downloadReportPDF('${esc(r.id)}')">Download PDF</button>${current.role==='manager'?'<button class="danger small" onclick="deleteInspection(\''+esc(r.id)+'\')">Delete</button>':''}</div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No reports have been submitted yet.</div>'}
function downloadCSV(){let a=db.reports.filter(r=>(current.role==='manager'||r.leaderId===current.id)&&(!reportFilterDate||String(r.date||reportDate(r)||'').slice(0,10)===reportFilterDate));let rows=[['Date','Shift','Picker','Line','Leader','Product Name','Barcode','SKU','Product Expiry Date','Quantity','Unit','Product Note','Overall Note']];a.forEach(r=>{let p=db.pickers.find(x=>x.id===r.pickerId),l=db.users.find(x=>x.id===r.leaderId);if(!r.items.length)rows.push([r.date,r.shift,p?.name,p?.line,l?.name,'No expiry found','','','','','',r.note]);r.items.forEach(i=>rows.push([r.date,r.shift,p?.name,p?.line,l?.name,i.name,i.barcode||'',i.sku||'',i.expiry,i.qty,i.unit||'PCS',i.note,r.note]))});let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a1=document.createElement('a');a1.href=url;a1.download='TeamGuard-Reports.csv';a1.click();URL.revokeObjectURL(url)}

function performancePage(){if(current.role!=='manager'){go('dashboard');return}let leaders=db.users.filter(u=>u.role==='leader');let rows=leaders.map(u=>{let assigned=db.schedule.filter(s=>s.leaderId===u.id),submitted=db.reports.filter(r=>r.leaderId===u.id),today=assigned.filter(s=>s.date===dateISO()).length;return '<tr><td><b>'+esc(u.name)+'</b><div class="muted">'+esc(u.shift)+' Shift</div></td><td>'+assigned.length+'</td><td>'+submitted.length+'</td><td>'+today+'</td><td><span class="pill '+(assigned.length&&submitted.length>=assigned.length?'green':'amber')+'">'+(assigned.length?Math.round(submitted.length/assigned.length*100)+'%':'—')+'</span></td><td><button class="secondary small" onclick="viewLeaderSchedules(\''+u.id+'\')">Schedules</button></td></tr>'}).join('');document.getElementById('view').innerHTML='<div class="card"><div class="between"><div><h3>Employee Performance</h3><p class="muted">Leader-wise assigned inspections and submitted reports.</p></div><span class="pill">'+leaders.length+' Leaders</span></div><div class="table-wrap section"><table><thead><tr><th>Shift Leader</th><th>Inspections Assigned</th><th>Reports Submitted</th><th>Today Assigned</th><th>Report / Assignment</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">No leaders found.</td></tr>')+'</tbody></table></div><p class="footer-note">Counts are based on schedules and reports currently saved in this browser.</p></div>'}
function activityPage(){if(current.role!=='manager'){go('dashboard');return}let a=db.activity||[];document.getElementById('view').innerHTML='<div class="card"><div class="between"><div><h3>Activity History</h3><p class="muted">Schedule create, edit, delete and report submission events.</p></div><span class="pill">'+a.length+' Events</span></div>'+(a.length?'<div class="table-wrap section"><table><thead><tr><th>Time</th><th>Person</th><th>Activity</th><th>Details</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+new Date(x.at).toLocaleString()+'</td><td>'+esc(x.by)+'</td><td><span class="pill">'+esc(x.action)+'</span></td><td>'+esc(x.details)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No activity recorded yet. New actions will appear here.</div>')+'</div>'}
function notificationsPage(){if(current.role!=='manager'){go('dashboard');return}let a=db.notifications||[];document.getElementById('view').innerHTML='<div class="card"><div class="between"><div><h3>Notifications</h3><p class="muted">New report submission alerts.</p></div><button class="secondary small" onclick="markNotificationsRead()">Mark all as read</button></div>'+(a.length?a.map(n=>'<div class="between" style="padding:14px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.message)+'</div><small class="muted">'+new Date(n.at).toLocaleString()+'</small></div><div class="actions">'+(!n.read?'<span class="pill amber">New</span>':'<span class="pill">Read</span>')+'</div></div>').join(''):'<div class="empty">No notifications yet. New submitted reports will appear here.</div>')+'</div>'}
function markNotificationsRead(){(db.notifications||[]).forEach(n=>n.read=true);save();render()}
function openNotificationReport(id){let n=(db.notifications||[]).find(x=>x.reportId===id);if(n)n.read=true;save();page='reports';reportDetails(id)}
